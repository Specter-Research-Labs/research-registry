# Generated by `spctr ci sync --write`; edit spctr.toml instead.

name: lenia-swarm-ci

on:
  pull_request:
    paths:
      - 'dossiers/lenia-swarm/**'
  push:
    branches: [main]
    paths:
      - 'dossiers/lenia-swarm/**'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull_request:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ops/spctr/target
          key: spctr-${{ runner.os }}-${{ hashFiles('ops/spctr/Cargo.lock') }}
          restore-keys: spctr-${{ runner.os }}-
      - name: Build spctr
        run: cargo build --release --locked --manifest-path ops/spctr/Cargo.toml
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: '0.9.26'
          enable-cache: true
          working-directory: dossiers/lenia-swarm
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Sync Python dependencies
        working-directory: dossiers/lenia-swarm
        run: uv sync --frozen --dev
      - name: Verify declared runtime requirements
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null; then
            echo "missing required runtime: swift" >&2
            exit 1
          fi
          if ! command -v cmake >/dev/null; then
            echo "missing required runtime: cmake" >&2
            exit 1
          fi
      - name: Run exec check
        run: ./ops/spctr/target/release/spctr exec run --project lenia-swarm check
  push_main:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ops/spctr/target
          key: spctr-${{ runner.os }}-${{ hashFiles('ops/spctr/Cargo.lock') }}
          restore-keys: spctr-${{ runner.os }}-
      - name: Build spctr
        run: cargo build --release --locked --manifest-path ops/spctr/Cargo.toml
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: '0.9.26'
          enable-cache: true
          working-directory: dossiers/lenia-swarm
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Sync Python dependencies
        working-directory: dossiers/lenia-swarm
        run: uv sync --frozen --dev
      - name: Verify declared runtime requirements
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null; then
            echo "missing required runtime: swift" >&2
            exit 1
          fi
          if ! command -v cmake >/dev/null; then
            echo "missing required runtime: cmake" >&2
            exit 1
          fi
          if ! command -v xcodebuild >/dev/null; then
            echo "missing required runtime: xcodebuild" >&2
            exit 1
          fi
          if ! command -v tar >/dev/null; then
            echo "missing required runtime: tar" >&2
            exit 1
          fi
      - name: Run exec check
        run: ./ops/spctr/target/release/spctr exec run --project lenia-swarm check
      - name: Run exec smoke
        run: ./ops/spctr/target/release/spctr exec run --project lenia-swarm smoke
      - name: Run exec build
        run: ./ops/spctr/target/release/spctr exec run --project lenia-swarm build
      - name: Run exec publish
        run: ./ops/spctr/target/release/spctr exec run --project lenia-swarm publish
      - name: Evaluate release gate
        run: ./ops/spctr/target/release/spctr release gate lenia-swarm
  nightly:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ops/spctr/target
          key: spctr-${{ runner.os }}-${{ hashFiles('ops/spctr/Cargo.lock') }}
          restore-keys: spctr-${{ runner.os }}-
      - name: Build spctr
        run: cargo build --release --locked --manifest-path ops/spctr/Cargo.toml
      - name: Verify declared runtime requirements
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null; then
            echo "missing required runtime: swift" >&2
            exit 1
          fi
          if ! command -v xcodebuild >/dev/null; then
            echo "missing required runtime: xcodebuild" >&2
            exit 1
          fi
          if ! command -v cmake >/dev/null; then
            echo "missing required runtime: cmake" >&2
            exit 1
          fi
      - name: Run exec smoke
        run: ./ops/spctr/target/release/spctr exec run --project lenia-swarm smoke
