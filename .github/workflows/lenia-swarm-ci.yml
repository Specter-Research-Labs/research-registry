# Generated by `spctr ci sync --write`; edit spctr.toml instead.

name: lenia-swarm-ci

on:
  pull_request:
    paths:
      - 'dossiers/lenia-swarm/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull_request:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup spctr project
        uses: ./.github/actions/setup-spctr
        with:
          project-root: 'dossiers/lenia-swarm'
          use-python: 'false'
          python-version: '3.11'
          use-uv: 'false'
          sync-python: 'false'
      - name: Verify declared runtime requirements
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null; then
            echo "missing required runtime: swift" >&2
            exit 1
          fi
      - name: Run exec check
        run: ./ops/spctr/target/release/spctr exec run --project lenia-swarm check
