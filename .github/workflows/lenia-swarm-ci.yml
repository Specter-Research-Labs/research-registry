# Generated by `spctr ci sync --write`; edit spctr.toml instead.

name: lenia-swarm-ci

on:
  pull_request:
    paths:
      - 'dossiers/lenia-swarm/**'
  push:
    branches: [main]
    paths:
      - 'dossiers/lenia-swarm/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull_request:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup spctr project
        uses: ./.github/actions/setup-spctr
        with:
          project-root: 'dossiers/lenia-swarm'
          use-python: 'true'
          python-version: '3.11'
          use-uv: 'true'
          sync-python: 'true'
      - name: Verify declared runtime requirements
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null; then
            echo "missing required runtime: swift" >&2
            exit 1
          fi
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v5.0.5
        with:
          path: |
            dossiers/lenia-swarm/.build/artifacts
            dossiers/lenia-swarm/.build/checkouts
            dossiers/lenia-swarm/.build/repositories
          key: spctr-swiftpm-deps-v1-${{ runner.os }}-${{ runner.arch }}-lenia-swarm-${{ hashFiles('dossiers/lenia-swarm/Package.swift', 'dossiers/lenia-swarm/Package.resolved') }}-pull_request
          restore-keys: |
            spctr-swiftpm-deps-v1-${{ runner.os }}-${{ runner.arch }}-lenia-swarm-${{ hashFiles('dossiers/lenia-swarm/Package.swift', 'dossiers/lenia-swarm/Package.resolved') }}-
      - name: Run exec check
        run: ./ops/spctr/target/release/spctr exec run --project lenia-swarm check
  push_main:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup spctr project
        uses: ./.github/actions/setup-spctr
        with:
          project-root: 'dossiers/lenia-swarm'
          use-python: 'true'
          python-version: '3.11'
          use-uv: 'true'
          sync-python: 'true'
      - name: Verify declared runtime requirements
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null; then
            echo "missing required runtime: swift" >&2
            exit 1
          fi
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v5.0.5
        with:
          path: |
            dossiers/lenia-swarm/.build/artifacts
            dossiers/lenia-swarm/.build/checkouts
            dossiers/lenia-swarm/.build/repositories
          key: spctr-swiftpm-deps-v1-${{ runner.os }}-${{ runner.arch }}-lenia-swarm-${{ hashFiles('dossiers/lenia-swarm/Package.swift', 'dossiers/lenia-swarm/Package.resolved') }}-push_main
          restore-keys: |
            spctr-swiftpm-deps-v1-${{ runner.os }}-${{ runner.arch }}-lenia-swarm-${{ hashFiles('dossiers/lenia-swarm/Package.swift', 'dossiers/lenia-swarm/Package.resolved') }}-
      - name: Run exec check
        run: ./ops/spctr/target/release/spctr exec run --project lenia-swarm check
