# Generated by `spctr ci sync --write`; edit spctr.toml instead.

name: typst-field-manual-ci

on:
  pull_request:
    paths:
      - 'addenda/typst-field-manual/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull_request:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ops/spctr/target
          key: spctr-${{ runner.os }}-${{ hashFiles('ops/spctr/Cargo.lock') }}
          restore-keys: spctr-${{ runner.os }}-
      - name: Build spctr
        run: cargo build --release --locked --manifest-path ops/spctr/Cargo.toml
      - name: Verify declared runtime requirements
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null; then
            echo "missing required runtime: python3" >&2
            exit 1
          fi
      - name: Run exec check
        run: ./ops/spctr/target/release/spctr exec run --project typst-field-manual check
