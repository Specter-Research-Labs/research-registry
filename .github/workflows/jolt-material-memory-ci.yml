# Generated by `spctr ci sync --write`; edit spctr.toml instead.

name: jolt-material-memory-ci

on:
  pull_request:
    paths:
      - '.github/workflows/jolt-material-memory-ci.yml'
      - 'ops/spctr/**'
      - 'dossiers/jolt-material-memory/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull_request:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ops/spctr/target
          key: spctr-${{ runner.os }}-${{ hashFiles('ops/spctr/Cargo.lock') }}
          restore-keys: spctr-${{ runner.os }}-
      - name: Build spctr
        run: cargo build --release --locked --manifest-path ops/spctr/Cargo.toml
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: '0.9.26'
          enable-cache: true
          working-directory: dossiers/jolt-material-memory
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Sync Python dependencies
        working-directory: dossiers/jolt-material-memory
        run: uv sync --frozen --dev
      - name: Run exec check
        run: ./ops/spctr/target/release/spctr exec run --project jolt-material-memory check
