# Generated by `spctr ci sync --write`; edit spctr.toml instead.

name: equational-theories-distillation-ci

on:
  pull_request:
    paths:
      - 'addenda/equational-theories-distillation/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull_request:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup spctr project
        uses: ./.github/actions/setup-spctr
        with:
          project-root: 'addenda/equational-theories-distillation'
          use-python: 'true'
          python-version: '3.12'
          use-uv: 'true'
          sync-python: 'true'
      - name: Run exec check
        run: ./ops/spctr/target/release/spctr exec run --project equational-theories-distillation check
