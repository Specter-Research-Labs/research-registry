name: Deploy dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch.yml"
      - "ops/spctr/**"
      - "ops/site/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.SPECTER_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.SPECTER_DEPLOY_USER }}
      REPO_ROOT: /srv/specterlab/research-registry
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ops/spctr
            ops/site

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ops/spctr -> target

      - name: Verify dispatch build
        run: cargo test --manifest-path ops/spctr/Cargo.toml

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SPECTER_DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync repo mirror to server
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$REPO_ROOT/ops/spctr' '$REPO_ROOT/ops/site'"
          rsync -az --delete             --exclude '.env*'             --exclude '.zuliprc*'             --exclude '__pycache__/'             --exclude '*.pyc'             --exclude 'target/'             ops/spctr/             "$DEPLOY_USER@$DEPLOY_HOST:$REPO_ROOT/ops/spctr/"
          rsync -az --delete             --exclude '__pycache__/'             --exclude '*.pyc'             ops/site/             "$DEPLOY_USER@$DEPLOY_HOST:$REPO_ROOT/ops/site/"

      - name: Rebuild dispatch from repo mirror
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "SPECTER_REPO_ROOT='$REPO_ROOT' bash '$REPO_ROOT/ops/spctr/dispatch/deploy/rebuild_dispatch_from_repo.sh'"
