name: Deploy dispatch

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.SPECTER_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.SPECTER_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.SPECTER_DEPLOY_SSH_KEY }}
      REPO_ROOT: /srv/specterlab/research-registry
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            ops/spctr

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?missing SPECTER_DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?missing SPECTER_DEPLOY_USER secret}"
          : "${DEPLOY_SSH_KEY:?missing SPECTER_DEPLOY_SSH_KEY secret}"

      - name: Install system tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: |
            ops/spctr -> target

      - name: Verify dispatch build
        run: cargo test --manifest-path ops/spctr/Cargo.toml

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync repo mirror to server
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$REPO_ROOT/ops/spctr'"
          rsync -az --delete             --exclude '.env*'             --exclude '.zuliprc*'             --exclude '__pycache__/'             --exclude '*.pyc'             --exclude 'target/'             ops/spctr/             "$DEPLOY_USER@$DEPLOY_HOST:$REPO_ROOT/ops/spctr/"

      - name: Rebuild dispatch from repo mirror
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "SPECTER_REPO_ROOT='$REPO_ROOT' bash '$REPO_ROOT/ops/spctr/dispatch/deploy/rebuild_dispatch_from_repo.sh'"
