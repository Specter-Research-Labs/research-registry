# Generated by `spctr ci sync --write`; edit spctr.toml instead.

name: zang-levin-playground-ci

on:
  pull_request:
    paths:
      - 'dossiers/zang-levin-playground/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull_request:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup spctr project
        uses: ./.github/actions/setup-spctr
        with:
          project-root: 'dossiers/zang-levin-playground'
          use-python: 'true'
          python-version: '3.13'
          use-uv: 'false'
          sync-python: 'false'
      - name: Run exec check
        run: ./ops/spctr/target/release/spctr exec run --project zang-levin-playground check
