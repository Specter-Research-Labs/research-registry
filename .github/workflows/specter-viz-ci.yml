# Generated by `spctr ci sync --write`; edit spctr.toml instead.

name: specter-viz-ci

on:
  pull_request:
    paths:
      - 'addenda/specter-viz/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull_request:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup spctr project
        uses: ./.github/actions/setup-spctr
        with:
          project-root: 'addenda/specter-viz'
          use-python: 'false'
          use-uv: 'false'
          sync-python: 'false'
          rust-targets: 'wasm32-unknown-unknown'
      - name: Run exec check
        run: ./ops/spctr/target/release/spctr exec run --project specter-viz check
