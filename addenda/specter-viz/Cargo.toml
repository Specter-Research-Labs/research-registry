[package]
name = "specter-viz"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "WASM analytics dashboard library for research visualization"
license-file = "../../LICENSES/PolyForm-Noncommercial-1.0.0.txt"
readme = "README.md"
repository = "https://github.com/Specter-Research-Labs/research-registry/tree/main/addenda/specter-viz"
homepage = "https://github.com/Specter-Research-Labs/research-registry/tree/main/addenda/specter-viz"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = "0.33"
egui_plot = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Response",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
