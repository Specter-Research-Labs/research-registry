version = 1
license = "Mixed: PolyForm-Noncommercial-1.0.0 (code), CC-BY-NC-4.0 (docs)"
title = "Poly Morphogenesis"
series = "A-013"
summary = "A Julia rebuild of the BITSEY controller, in which reaction–diffusion and a peak-counting gene network run in alternating phases, steering the pattern toward a target number of peaks."
status = "concept"

[site]
visible = true
featured = false

[labels]
type = "research"

[release]
stage = "wip"

[[release.surfaces]]
name = "source"
kind = "source_bundle"
publish = false

[spctr]
project = "poly-morphogenesis"

[spctr.docs]
root = "docs"
landing = "docs/report-draft.md"
require_frontmatter = false

[spctr.exec.check]
description = "Run the Julia parity and CLI test suite in the pinned root flake shell"
command = ["bash", "-lc", '''set -euo pipefail
nix develop ../../../#poly-morphogenesis -c julia --project=. -e 'using Pkg; Pkg.test()'
''']
timeout_sec = 3600
network = "bootstrap"
requires = ["nix"]

[spctr.runtime]
platforms = ["linux", "macos"]
requires = ["nix"]
network = "bootstrap"
cache_paths = ["Manifest.toml"]

[spctr.evidence]
card_path = "artifacts/evidence/latest.json"
