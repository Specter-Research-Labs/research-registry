version = 1
license = "Mixed: PolyForm-Noncommercial-1.0.0 (code), CC-BY-NC-4.0 (docs)"
title = "Poly Morphogenesis"
series = "A-013"
summary = "Julia implementation of the BITSEY reaction-diffusion controller as composed Poly-style systems."
status = "concept"

[site]
visible = false
featured = false

[labels]
type = "research"

[release]
stage = "wip"

[[release.surfaces]]
name = "source"
kind = "source_bundle"
publish = false

[spctr]
project = "poly-morphogenesis"

[spctr.exec.check]
description = "Run the Julia parity and CLI test suite in the pinned root flake shell"
command = ["bash", "-lc", '''set -euo pipefail
export JULIA_NUM_THREADS=1
nix develop ../..#poly-morphogenesis -c julia --startup-file=no --project=. -e 'using Pkg; Pkg.test()'
''']
timeout_sec = 3600
network = "bootstrap"
requires = ["nix"]

[spctr.exec.smoke]
description = "Run a tiny deterministic post-lesion recovery"
command = ["bash", "-lc", '''set -euo pipefail
mkdir -p artifacts/smoke
export POLY_MORPHOGENESIS_REVISION="$(jj log -r 'latest(ancestors(@) & bookmarks())' --no-graph -T 'commit_id')"
export JULIA_NUM_THREADS=1
nix develop ../..#poly-morphogenesis -c julia --startup-file=no --project=. -e '
using PolyMorphogenesis
main([
    "demo", "grid-patch-recovery",
    "--rows", "2", "--cols", "3",
    "--patch-top", "1", "--patch-left", "2",
    "--patch-rows", "1", "--patch-cols", "1",
    "--seed", "7",
    "--exponent-min", "0", "--exponent-max", "0",
    "--max-iterations", "1",
    "--settle-time", "0.1", "--steady-stop", "false",
    "--include-delayed-capacity", "false", "--include-feedback", "false",
    "--evidence-scope", "smoke_contract",
])
' > artifacts/smoke/grid-patch-recovery.json
''']
expected_outputs = ["grid-patch-recovery-smoke"]
timeout_sec = 1800
network = "bootstrap"
requires = ["jj", "nix"]

[spctr.exec.development]
description = "Run the guarded development protocol on a tiny deterministic case"
command = ["bash", "-lc", '''set -euo pipefail
root="artifacts/development/spctr-smoke-v2"
export POLY_MORPHOGENESIS_REVISION="$(jj log -r 'latest(ancestors(@) & bookmarks())' --no-graph -T 'commit_id')"
export JULIA_NUM_THREADS=1
if [ ! -f "$root/development-manifest.json" ]; then
  nix develop ../..#poly-morphogenesis -c julia --startup-file=no --project=. -e '
using PolyMorphogenesis
main([
    "demo", "grid-patch-recovery-development",
    "--development-id", "spctr-smoke-v2",
    "--output-dir", "artifacts/development/spctr-smoke-v2",
    "--seeds", "7",
    "--regime-id", "tiny-development-grid",
    "--rows", "1", "--cols", "2",
    "--patch-rows", "1", "--patch-cols", "1",
    "--patch-top", "1", "--patch-left", "1",
    "--settle-chunk-time", "0.01", "--settle-max-time", "0.02",
    "--steady-tol", "1000000.0",
    "--exponent-min", "0", "--exponent-max", "0",
    "--exponent-hard-min", "-1", "--exponent-hard-max", "1",
    "--exponent-expansion-step", "1",
    "--exponent-plateau-relative-tol", "0.0",
    "--exponent-plateau-patience", "2",
    "--alias-resolutions", "0.001",
])
'
fi
nix develop ../..#poly-morphogenesis -c julia --startup-file=no --project=. -e '
using JSON3, SHA
root = "artifacts/development/spctr-smoke-v2"
manifest = JSON3.read(read(joinpath(root, "development-manifest.json"), String))
String(manifest.code_revision) == ENV["POLY_MORPHOGENESIS_REVISION"] ||
    error("stale development artifact revision")
for (name, metadata) in pairs(manifest.files)
    bytes2hex(sha256(read(joinpath(root, String(name))))) == String(metadata.sha256) ||
        error("development artifact digest mismatch: $(name)")
end
'
''']
expected_outputs = [
  "recovery-development-protocol",
  "recovery-development-surfaces",
  "recovery-development-cases",
  "recovery-development-summary",
  "recovery-development-manifest",
]
timeout_sec = 1800
network = "bootstrap"
requires = ["jj", "nix"]

[spctr.runtime]
platforms = ["linux", "macos"]
requires = ["nix"]
network = "bootstrap"
cache_paths = ["Manifest.toml"]

[spctr.evidence]
card_path = "artifacts/evidence/latest.json"

[[spctr.expected_outputs]]
name = "grid-patch-recovery-smoke"
path = "artifacts/smoke/grid-patch-recovery.json"
kind = "json"
required = true

[[spctr.expected_outputs]]
name = "recovery-development-protocol"
path = "artifacts/development/spctr-smoke-v2/development-protocol.json"
kind = "json"
required = true

[[spctr.expected_outputs]]
name = "recovery-development-surfaces"
path = "artifacts/development/spctr-smoke-v2/response-surfaces.jsonl"
kind = "jsonl"
required = true

[[spctr.expected_outputs]]
name = "recovery-development-cases"
path = "artifacts/development/spctr-smoke-v2/observability-cases.jsonl"
kind = "jsonl"
required = true

[[spctr.expected_outputs]]
name = "recovery-development-summary"
path = "artifacts/development/spctr-smoke-v2/observability-summary.json"
kind = "json"
required = true

[[spctr.expected_outputs]]
name = "recovery-development-manifest"
path = "artifacts/development/spctr-smoke-v2/development-manifest.json"
kind = "json"
required = true
