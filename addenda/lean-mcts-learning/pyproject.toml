[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lean-mcts-learning"
version = "0.1.0"
description = "Offline learning experiments for Lean x MCTS (wonton-soup addendum)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "modal>=1.2.0",
]

[dependency-groups]
dev = [
  "ty>=0.0.1a7",
  "ruff>=0.8",
  "pytest>=8.0",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [
  "cli.py",
  "data",
  "eval",
  "lean_mcts_learning.py",
  "shared.py",
  "tests",
  "train",
]

[project.scripts]
lean-mcts-learning = "cli:main"

[tool.hatch.build.targets.wheel]
only-include = [
  "cli.py",
  "data",
  "eval",
  "lean_mcts_learning.py",
  "modal_jobs",
  "shared.py",
  "train",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
