version = 1
license = "Mixed: PolyForm-Noncommercial-1.0.0 (code), CC-BY-NC-4.0 (docs)"
title = "lean-tactic-representation"
series = "A-004"
summary = "Algebraic, round-trippable representations of Lean proof-state tactics."
status = "concept"

[site]
visible = true
featured = false
publish_docs = false

[labels]
type = "research"

[release]
stage = "candidate"

[[release.surfaces]]
name = "source"
kind = "source_bundle"
publish = true

[[release.surfaces]]
name = "python"
kind = "package"
publish = false
language = "python"
registry = "pypi"
publish_mode = "subdir"

[spctr]
project = "lean-tactic-representation"

[spctr.exec.check]
description = "Canonical candidate verification lane"
commands = [
    ["uv", "run", "ruff", "check", "."],
    ["uv", "run", "ty", "check", "."],
    ["uv", "run", "python", "-m", "pytest"],
]
timeout_sec = 1800
network = "off"
requires = ["python", "uv"]

[spctr.exec.smoke]
description = "Invariant check for the nested constructor apply example"
command = ["bash", "-lc", '''set -euo pipefail
mkdir -p artifacts/smoke
uv run python cli.py check nested_constructor_apply --format json > artifacts/smoke/nested_constructor_apply.json
''']
expected_outputs = ["nested-constructor-apply-check"]
timeout_sec = 600
network = "off"
requires = ["python", "uv"]

[spctr.runtime]
platforms = ["linux", "macos"]
requires = ["python", "uv"]
network = "off"
cache_paths = [".venv", ".ruff_cache", ".pytest_cache"]

[spctr.ci]
runner = "ubuntu-latest"
pull_request = ["check"]
push_main = []
nightly = []

[spctr.evidence]
card_path = "artifacts/evidence/latest.json"

[[spctr.expected_outputs]]
name = "nested-constructor-apply-check"
path = "artifacts/smoke/nested_constructor_apply.json"
kind = "json"
required = true

[spctr.docs]
root = "docs"
landing = "README.md"
require_frontmatter = false
