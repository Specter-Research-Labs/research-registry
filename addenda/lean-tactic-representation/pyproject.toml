[project]
name = "lean-tactic-representation"
version = "0.1.0"
description = "Toy interpreter and CLI visualizer for algebraic tactic-calculus fragments"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ty>=0.0.1a7",
  "ruff>=0.8",
  "pytest>=8.0",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [
  "cli.py",
  "core",
  "examples",
  "lean_tactic_representation.py",
  "render.py",
  "tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
