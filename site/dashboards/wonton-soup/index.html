<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wonton Soup Dashboard | Specter Labs</title>
    <meta name="description" content="Inspect individual Wonton Soup proof searches in Lean: theorem traces and run data." />
    <link rel="icon" href="/assets/logo-black.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const isViteDev = Boolean(import.meta.env?.DEV);
      if (isViteDev) {
        await import("/src/main.ts");
      } else {
        const stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = "build/assets/main.css";
        document.head.append(stylesheet);
        const productionModule = "./build/assets/main.js";
        await import(productionModule);
      }
    </script>
  </body>
</html>
