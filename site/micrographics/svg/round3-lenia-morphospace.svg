<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
    <title id="title">Lenia Swarm round 3 synthetic morphospace</title>
    <desc id="desc">An editable monochrome Lenia Swarm synthetic morphospace label with a segmented clipped orb.</desc>
    <defs>
        <clipPath id="orb-clip">
            <circle cx="0" cy="0" r="78"/>
        </clipPath>
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M30 0H0V30" class="grid-line"/>
        </pattern>
        <style>
            .bg { fill: #050605; }
            .grid-line { stroke: #dde2da; stroke-width: .45; opacity: .07; fill: none; }
            .ink { fill: #dde2da; }
            .line { stroke: #dde2da; stroke-width: 1.2; fill: none; stroke-linecap: square; }
            .hair { stroke: #dde2da; stroke-width: .8; fill: none; stroke-linecap: square; }
            .cut { fill: #050605; stroke: #dde2da; stroke-width: .95; }
            text { fill: #dde2da; font-family: "Berkeley Mono", ui-monospace, monospace; letter-spacing: .1em; }
        </style>
    </defs>
    <rect class="bg" width="640" height="360"/>
    <rect width="640" height="360" fill="url(#grid)"/>

    <g transform="translate(68 86)">
        <text x="0" y="0" font-size="13">D-003</text>
        <text x="0" y="31" font-size="17">LENIA SWARM</text>
        <text x="0" y="62" font-size="11">SYNTHETIC MORPHOSPACE</text>
        <line class="line" x1="0" y1="91" x2="228" y2="91"/>
