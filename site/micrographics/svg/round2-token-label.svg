<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
    <title id="title">Design Tokens round 2 textile label</title>
    <desc id="desc">A pale textile-style Design Tokens addendum label.</desc>
    <defs>
        <pattern id="cloth" width="5" height="5" patternUnits="userSpaceOnUse">
            <path d="M0 0H5M0 2.5H5M0 0V5M2.5 0V5" stroke="#0b0e14" stroke-width=".3" opacity=".16"/>
        </pattern>
        <style>
            .bg { fill: #050605; }
            .paper { fill: #f2f0e8; }
            .ink { fill: #0b0e14; }
            .line { stroke: #0b0e14; stroke-width: 1.3; fill: none; }
            text { fill: #0b0e14; font-family: "Berkeley Mono", ui-monospace, monospace; letter-spacing: .08em; }
        </style>
    </defs>
    <rect class="bg" width="640" height="360"/>
    <g transform="translate(190 92)">
        <rect class="paper" width="270" height="142" rx="3"/>
        <rect width="270" height="142" fill="url(#cloth)" rx="3"/>
        <rect class="line" x="22" y="22" width="58" height="28" rx="12"/>
        <text x="36" y="42" font-size="14">A-011</text>
        <text x="122" y="42" font-size="15">DESIGN TOKENS</text>
        <g transform="translate(32 70)">
            <rect class="ink" x="0" y="0" width="10" height="10"/>
            <rect class="ink" x="20" y="0" width="10" height="10"/>
            <rect class="ink" x="10" y="10" width="10" height="10"/>
            <rect class="ink" x="0" y="20" width="10" height="10"/>
            <rect class="ink" x="20" y="20" width="10" height="10"/>
            <circle class="ink" cx="70" cy="5" r="4"/>
            <circle class="ink" cx="86" cy="5" r="4"/>
            <circle class="ink" cx="102" cy="5" r="4"/>
            <circle class="ink" cx="70" cy="21" r="4"/>
            <circle class="ink" cx="86" cy="21" r="4"/>
            <circle class="ink" cx="102" cy="21" r="4"/>
            <circle class="ink" cx="148" cy="15" r="16"/>
            <circle class="paper" cx="148" cy="15" r="3"/>
        </g>
        <line class="line" x1="22" y1="108" x2="248" y2="108"/>
        <text x="22" y="130" font-size="11">TOKENS / SYSTEMS / STYLE</text>
        <text x="166" y="130" font-size="11">REGISTRY / 2026</text>
