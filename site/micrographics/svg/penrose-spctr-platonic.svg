<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
    <title id="title">SPCTR Penrose platonic mental physical micrographic</title>
    <desc id="desc">A high fidelity vector reconstruction of the SPCTR Penrose three worlds plate, with platonic dot lattice, mental eye frame, physical isometric block, labels, and particle flow fields.</desc>
    <defs>
        <style>
            @font-face {
                font-family: "Berkeley Mono";
                src: url("../../fonts/BerkeleyMono-Regular.woff2") format("woff2");
                font-weight: 400;
            }

            .bg { fill: #020403; }
            .ink { fill: #e8ebe5; }
            .line { fill: none; stroke: #e8ebe5; stroke-linecap: square; stroke-linejoin: miter; }
            .rule { stroke-width: 3.1; }
            .hair { stroke-width: 1.55; }
            .soft { opacity: .78; }
            .faint { opacity: .36; }
            .dot { fill: #e8ebe5; }
            text {
                fill: #e8ebe5;
                font-family: "Berkeley Mono", "SF Mono", Menlo, Consolas, monospace;
                font-weight: 400;
                letter-spacing: .18em;
            }
            .label { font-size: 27px; }
            .index { font-size: 25px; }
            .small { font-size: 15px; letter-spacing: .12em; }
        </style>

        <filter id="softGlow" x="-18%" y="-18%" width="136%" height="136%">
            <feGaussianBlur in="SourceGraphic" stdDeviation=".72" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="37" result="noise"/>
            <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.86 0 0 0 0 0.88 0 0 0 0 0.84 0 0 0 .18 0"/>
        </filter>

        <pattern id="fineDots" width="5.6" height="5.6" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r=".86" fill="#e8ebe5" opacity=".86"/>
            <circle cx="3.9" cy="3.3" r=".58" fill="#e8ebe5" opacity=".52"/>
        </pattern>

        <pattern id="mediumDots" width="7" height="7" patternUnits="userSpaceOnUse">
            <circle cx="1.2" cy="1.2" r=".9" fill="#e8ebe5" opacity=".86"/>
            <circle cx="5" cy="4.1" r=".68" fill="#e8ebe5" opacity=".5"/>
        </pattern>

        <linearGradient id="leftBeamFade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
            <stop offset=".28" stop-color="#fff" stop-opacity=".88"/>
            <stop offset=".72" stop-color="#fff" stop-opacity=".95"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
        </linearGradient>

        <linearGradient id="rightBeamFade" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
            <stop offset=".26" stop-color="#fff" stop-opacity=".86"/>
            <stop offset=".74" stop-color="#fff" stop-opacity=".95"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".1"/>
        </linearGradient>

        <linearGradient id="centerBeamFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".98"/>
            <stop offset=".68" stop-color="#fff" stop-opacity=".76"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
        </linearGradient>

        <linearGradient id="bottomBeamFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity=".98"/>
            <stop offset=".55" stop-color="#fff" stop-opacity=".9"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".03"/>
        </linearGradient>

        <mask id="leftBeamMask">
            <rect width="1254" height="1254" fill="#000"/>
            <path d="M488 486 C454 550 400 644 346 748 C404 683 464 591 520 506 Z" fill="url(#leftBeamFade)"/>
        </mask>

        <mask id="rightBeamMask">
            <rect width="1254" height="1254" fill="#000"/>
            <path d="M765 486 C804 559 858 647 912 762 C836 688 779 597 734 505 Z" fill="url(#rightBeamFade)"/>
        </mask>

        <mask id="centerBeamMask">
            <rect width="1254" height="1254" fill="#000"/>
            <path d="M604 487 C610 522 611 570 620 613 C632 574 639 525 648 487 Z" fill="url(#centerBeamFade)"/>
        </mask>

        <mask id="bottomBeamMask">
            <rect width="1254" height="1254" fill="#000"/>
            <path d="M444 851 C538 841 670 850 763 862 C661 877 548 882 444 874 Z" fill="url(#bottomBeamFade)"/>
        </mask>

        <clipPath id="mentalInnerClip">
            <rect x="187" y="777" width="241" height="166"/>
        </clipPath>

        <radialGradient id="vignette" cx="50%" cy="47%" r="63%">
            <stop offset="0" stop-color="#000" stop-opacity="0"/>
            <stop offset=".72" stop-color="#000" stop-opacity=".15"/>
            <stop offset="1" stop-color="#000" stop-opacity=".74"/>
        </radialGradient>
    </defs>

    <rect class="bg" width="1254" height="1254"/>
    <rect width="1254" height="1254" filter="url(#grain)" opacity=".24"/>
    <rect width="1254" height="1254" fill="none" stroke="#0a0e0b" stroke-width="2"/>
    <rect width="1254" height="1254" fill="url(#vignette)"/>

