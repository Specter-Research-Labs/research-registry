<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
    <title id="title">Penrose three worlds SPCTR seal</title>
    <desc id="desc">A compact vector seal for the Penrose three worlds model using the same platonic lattice, SPCTR center mark, mental eye frame, physical isometric block, and particle fields as the full SPCTR platonic poster.</desc>
    <defs>
        <style>
            @font-face {
                font-family: "Berkeley Mono";
                src: url("../../fonts/BerkeleyMono-Regular.woff2") format("woff2");
                font-weight: 400;
            }

            .bg { fill: #020403; }
            .ink { fill: #e8ebe5; }
            .line { fill: none; stroke: #e8ebe5; stroke-linecap: square; stroke-linejoin: miter; }
            .rule { stroke-width: 2.1; }
            .hair { stroke-width: 1.05; }
            .dot { fill: #e8ebe5; }
            text {
                fill: #e8ebe5;
                font-family: "Berkeley Mono", "SF Mono", Menlo, Consolas, monospace;
                font-weight: 400;
                letter-spacing: .18em;
            }
            .label { font-size: 16px; }
            .micro { font-size: 9px; letter-spacing: .12em; }
            .index { font-size: 13px; }
        </style>

        <filter id="softGlow" x="-18%" y="-18%" width="136%" height="136%">
            <feGaussianBlur in="SourceGraphic" stdDeviation=".42" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="19" result="noise"/>
            <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.86 0 0 0 0 0.88 0 0 0 0 0.84 0 0 0 .14 0"/>
        </filter>

        <pattern id="fineDots" width="4.5" height="4.5" patternUnits="userSpaceOnUse">
            <circle cx=".85" cy=".85" r=".55" fill="#e8ebe5" opacity=".86"/>
            <circle cx="3.1" cy="2.7" r=".36" fill="#e8ebe5" opacity=".48"/>
        </pattern>

        <pattern id="mediumDots" width="5.8" height="5.8" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r=".62" fill="#e8ebe5" opacity=".86"/>
            <circle cx="4.2" cy="3.6" r=".42" fill="#e8ebe5" opacity=".48"/>
        </pattern>

        <radialGradient id="vignette" cx="50%" cy="47%" r="68%">
            <stop offset="0" stop-color="#000" stop-opacity="0"/>
            <stop offset=".72" stop-color="#000" stop-opacity=".16"/>
            <stop offset="1" stop-color="#000" stop-opacity=".78"/>
        </radialGradient>

        <linearGradient id="leftBeamFade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".08"/>
            <stop offset=".24" stop-color="#fff" stop-opacity=".82"/>
            <stop offset=".72" stop-color="#fff" stop-opacity=".92"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
        </linearGradient>

        <linearGradient id="rightBeamFade" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".08"/>
            <stop offset=".24" stop-color="#fff" stop-opacity=".82"/>
            <stop offset=".72" stop-color="#fff" stop-opacity=".92"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
        </linearGradient>

        <linearGradient id="centerBeamFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
            <stop offset=".66" stop-color="#fff" stop-opacity=".7"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".04"/>
        </linearGradient>

        <linearGradient id="bottomBeamFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
            <stop offset=".55" stop-color="#fff" stop-opacity=".84"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".03"/>
        </linearGradient>

        <mask id="leftBeamMask">
            <rect width="640" height="360" fill="#000"/>
            <path d="M248 151 C220 190 190 235 156 294 C190 257 226 199 264 162 Z" fill="url(#leftBeamFade)"/>
        </mask>

        <mask id="rightBeamMask">
            <rect width="640" height="360" fill="#000"/>
            <path d="M391 151 C424 195 454 239 484 299 C444 261 412 204 376 162 Z" fill="url(#rightBeamFade)"/>
        </mask>

        <mask id="centerBeamMask">
            <rect width="640" height="360" fill="#000"/>
            <path d="M305 153 C308 174 310 198 315 221 C322 197 326 174 331 153 Z" fill="url(#centerBeamFade)"/>
        </mask>

        <mask id="bottomBeamMask">
            <rect width="640" height="360" fill="#000"/>
            <path d="M216 269 C282 263 341 266 397 272 C334 280 274 281 216 278 Z" fill="url(#bottomBeamFade)"/>
        </mask>

        <clipPath id="mentalClip">
            <rect x="52" y="224" width="152" height="78"/>
        </clipPath>
    </defs>

    <rect class="bg" width="640" height="360"/>
    <rect width="640" height="360" filter="url(#grain)" opacity=".22"/>
    <rect width="640" height="360" fill="url(#vignette)"/>

    <g filter="url(#softGlow)">
        <text class="label" x="269" y="38">PLATONIC</text>

        <g id="platonic-grid">
            <circle class="dot" cx="235" cy="56" r="1.35"/>
            <circle class="dot" cx="250" cy="56" r="1.35"/>
            <circle class="dot" cx="265" cy="56" r="1.35"/>
            <circle class="dot" cx="280" cy="56" r="1.35"/>
            <circle class="dot" cx="295" cy="56" r="1.35"/>
            <circle class="dot" cx="310" cy="56" r="1.35"/>
            <circle class="dot" cx="325" cy="56" r="1.35"/>
            <circle class="dot" cx="340" cy="56" r="1.35"/>
            <circle class="dot" cx="355" cy="56" r="1.35"/>
            <circle class="dot" cx="370" cy="56" r="1.35"/>
            <circle class="dot" cx="385" cy="56" r="1.35"/>
            <circle class="dot" cx="400" cy="56" r="1.35"/>

            <circle class="dot" cx="235" cy="72" r="1.35"/>
            <circle class="dot" cx="250" cy="72" r="1.35"/>
            <circle class="dot" cx="265" cy="72" r="1.35"/>
            <circle class="dot" cx="280" cy="72" r="1.35"/>
            <circle class="dot" cx="295" cy="72" r="1.35"/>
            <circle class="dot" cx="310" cy="72" r="1.35"/>
            <circle class="dot" cx="325" cy="72" r="1.35"/>
            <circle class="dot" cx="340" cy="72" r="1.35"/>
            <circle class="dot" cx="355" cy="72" r="1.35"/>
            <circle class="dot" cx="370" cy="72" r="1.35"/>
            <circle class="dot" cx="385" cy="72" r="1.35"/>
            <circle class="dot" cx="400" cy="72" r="1.35"/>

            <circle class="dot" cx="235" cy="88" r="1.35"/>
            <circle class="dot" cx="250" cy="88" r="1.35"/>
            <circle class="dot" cx="265" cy="88" r="1.35"/>
            <circle class="dot" cx="280" cy="88" r="1.35"/>
            <circle class="dot" cx="295" cy="88" r="1.35"/>
            <circle class="dot" cx="310" cy="88" r="1.35"/>
            <circle class="dot" cx="325" cy="88" r="1.35"/>
            <circle class="dot" cx="340" cy="88" r="1.35"/>
            <circle class="dot" cx="355" cy="88" r="1.35"/>
            <circle class="dot" cx="370" cy="88" r="1.35"/>
            <circle class="dot" cx="385" cy="88" r="1.35"/>
            <circle class="dot" cx="400" cy="88" r="1.35"/>

            <circle class="dot" cx="235" cy="104" r="1.35"/>
            <circle class="dot" cx="250" cy="104" r="1.35"/>
            <circle class="dot" cx="265" cy="104" r="1.35"/>
            <circle class="dot" cx="280" cy="104" r="1.35"/>
            <circle class="dot" cx="295" cy="104" r="1.35"/>
            <circle class="dot" cx="310" cy="104" r="1.35"/>
            <circle class="dot" cx="325" cy="104" r="1.35"/>
            <circle class="dot" cx="340" cy="104" r="1.35"/>
            <circle class="dot" cx="355" cy="104" r="1.35"/>
            <circle class="dot" cx="370" cy="104" r="1.35"/>
            <circle class="dot" cx="385" cy="104" r="1.35"/>
            <circle class="dot" cx="400" cy="104" r="1.35"/>

            <circle class="dot" cx="250" cy="120" r="1.35"/>
            <circle class="dot" cx="265" cy="120" r="1.35"/>
            <circle class="dot" cx="280" cy="120" r="1.35"/>
            <circle class="dot" cx="295" cy="120" r="1.35"/>
            <circle class="dot" cx="310" cy="120" r="1.35"/>
            <circle class="dot" cx="325" cy="120" r="1.35"/>
            <circle class="dot" cx="340" cy="120" r="1.35"/>
            <circle class="dot" cx="355" cy="120" r="1.35"/>
            <circle class="dot" cx="370" cy="120" r="1.35"/>
            <circle class="dot" cx="385" cy="120" r="1.35"/>
        </g>

        <path class="line hair" d="M310 94H329"/>
        <path class="line hair" d="M319.5 84.5V103.5"/>
        <path class="line rule" d="M235 136H253L267 156H372L386 136H404"/>

        <g mask="url(#leftBeamMask)" opacity=".92">
            <rect x="155" y="150" width="104" height="154" fill="url(#mediumDots)" transform="rotate(-27 207 227)"/>
            <rect x="165" y="157" width="88" height="137" fill="url(#fineDots)" opacity=".55" transform="rotate(-27 209 226)"/>
        </g>
        <g mask="url(#rightBeamMask)" opacity=".92">
            <rect x="378" y="150" width="108" height="156" fill="url(#mediumDots)" transform="rotate(27 432 228)"/>
            <rect x="386" y="157" width="92" height="139" fill="url(#fineDots)" opacity=".55" transform="rotate(27 432 227)"/>
        </g>
        <g mask="url(#centerBeamMask)" opacity=".9">
            <rect x="302" y="152" width="33" height="72" fill="url(#fineDots)"/>
        </g>
        <g mask="url(#bottomBeamMask)" opacity=".9">
            <rect x="212" y="258" width="190" height="28" fill="url(#fineDots)"/>
        </g>

        <g id="center-mark">
            <rect class="ink" x="297" y="204" width="5.2" height="4.6"/>
            <rect class="ink" x="307" y="204" width="5.2" height="4.6"/>
            <rect class="ink" x="317" y="204" width="5.2" height="4.6"/>
            <rect class="ink" x="327" y="204" width="5.2" height="4.6"/>
            <rect class="ink" x="337" y="204" width="5.2" height="4.6"/>
            <text class="label" x="292" y="232">SPCTR</text>
            <rect class="ink" x="296" y="244" width="7" height="7"/>
            <rect class="ink" x="310" y="244" width="7" height="7"/>
            <rect class="ink" x="324" y="244" width="7" height="7"/>
            <rect class="ink" x="338" y="244" width="7" height="7"/>
            <rect class="ink" x="303" y="251" width="7" height="7"/>
            <rect class="ink" x="317" y="251" width="7" height="7"/>
            <rect class="ink" x="331" y="251" width="7" height="7"/>
        </g>

        <g id="mental-world">
            <path class="line rule" d="M52 224H204V302H52Z"/>
            <path class="line rule" d="M49 214H40V223"/>
            <path class="line rule" d="M207 214H216V223"/>
            <path class="line rule" d="M40 306V315H49"/>
            <path class="line rule" d="M216 306V315H207"/>

            <g clip-path="url(#mentalClip)">
                <path class="line rule" d="M75 272C94 238 160 234 184 272"/>
                <circle class="line rule" cx="128" cy="260" r="16"/>
                <circle class="ink" cx="128" cy="260" r="4.2"/>
                <rect class="ink" x="125.5" y="231" width="5" height="5"/>
                <rect class="ink" x="125.5" y="241.5" width="5" height="5"/>
                <rect class="ink" x="125.5" y="285" width="5" height="5"/>
                <rect class="ink" x="125.5" y="295.5" width="5" height="5"/>
            </g>

            <text class="label" x="82" y="335">MENTAL</text>
        </g>

        <g id="physical-world">
            <path class="line rule" d="M390 245L480 195L590 250L500 305Z"/>
            <path class="line rule" d="M390 245L500 305V334L390 274Z"/>
            <path class="line rule" d="M500 305L590 250V280L500 334Z"/>

            <path class="line hair" d="M408 235L518 290"/>
            <path class="line hair" d="M426 225L536 280"/>
            <path class="line hair" d="M444 215L554 270"/>
            <path class="line hair" d="M462 205L572 260"/>
            <path class="line hair" d="M502 206L412 260"/>
            <path class="line hair" d="M524 217L434 272"/>
            <path class="line hair" d="M546 228L456 283"/>
            <path class="line hair" d="M568 239L478 294"/>

            <path class="line hair" d="M412 260L412 286"/>
            <path class="line hair" d="M434 272L434 298"/>
            <path class="line hair" d="M456 283L456 310"/>
            <path class="line hair" d="M478 294L478 322"/>
            <path class="line hair" d="M518 290L518 323"/>
            <path class="line hair" d="M536 280L536 312"/>
            <path class="line hair" d="M554 270L554 301"/>
            <path class="line hair" d="M572 260L572 290"/>

            <path class="line rule" d="M383 299H374V308"/>
            <path class="line rule" d="M607 283V292H598"/>
            <text class="label" x="431" y="352">PHYSICAL</text>
        </g>

        <g id="indices">
            <text class="index" x="158" y="196">03</text>
            <path class="line rule" d="M177 207H161V220"/>
            <text class="index" x="451" y="202">01</text>
            <path class="line rule" d="M451 213H468V226"/>
            <path class="line rule" d="M315 316H328V296"/>
            <text class="index" x="317" y="338">02</text>
        </g>
    </g>
</svg>
