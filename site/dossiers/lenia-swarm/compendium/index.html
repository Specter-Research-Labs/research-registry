<!doctypehtml><html lang=en><head><meta charset=UTF-8><meta content=width=device-width,initial-scale=1.0 name=viewport><meta content=light name=color-scheme><title>Lenia Compendium | SPECTER Labs</title><link href=../../../assets/logo-black.svg rel=icon type=image/svg+xml><link href=../../../style.css rel=stylesheet><link href=https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css rel=stylesheet><script defer src=https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js></script><style>.site-shell{--site-shell-max-width:1400px}.compendium-toolbar{flex-wrap:wrap;align-items:end;gap:10px;margin-bottom:1.25em;display:flex}.compendium-toolbar label{letter-spacing:.08em;text-transform:uppercase;color:var(--site-muted);gap:4px;font-size:11px;display:grid}.compendium-toolbar select,.compendium-toolbar input{border:1px solid var(--site-rule);background:var(--sl-color-paper);min-width:14rem;font:inherit;padding:6px 8px;font-size:12px}.compendium-toolbar .detail-links{align-self:end;gap:1.25rem;margin-left:auto;display:flex}.compendium-toolbar .detail-links a{text-transform:uppercase;letter-spacing:.08em;font-size:11px}.compendium-toolbar .detail-links a+a{border-left:1px solid #1414142e;padding-left:1.25rem}.compendium-detail-panel{border:1px solid var(--site-rule);margin-bottom:1.5em;padding:1em;display:none}.compendium-detail-panel.is-open{display:block}.compendium-detail-close{border:1px solid var(--site-rule);background:var(--sl-color-paper);font:inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-bottom:1em;padding:4px 8px;font-size:11px;display:inline-block}.compendium-detail-close:hover{border-color:var(--site-rule-strong)}.compendium-grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;display:grid}.compendium-tile{border:1px solid var(--site-rule);background:var(--sl-color-paper);text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit;gap:0;padding:0;display:grid;overflow:hidden}.compendium-tile:hover,.compendium-tile:focus-visible{border-color:var(--site-rule-strong);outline:none}.compendium-tile.is-active{border-color:var(--sl-color-ink);box-shadow:0 0 0 1px var(--sl-color-ink)}.compendium-tile-thumb{aspect-ratio:1;background:#0b0510;width:100%;display:block;position:relative;overflow:hidden}.compendium-tile-thumb img,.compendium-stage-poster,.compendium-stage-canvas,.compendium-anatomy-card img,.compendium-anatomy-card canvas{object-fit:cover;width:100%;height:100%;image-rendering:pixelated;display:block}.compendium-tile-thumb img{opacity:1}.compendium-tile-thumb canvas{width:100%;height:100%;image-rendering:pixelated;opacity:0;transition:opacity .28s;position:absolute;inset:0}.compendium-tile-thumb canvas.is-live{opacity:1}.compendium-tile-thumb canvas.is-live+img{opacity:0}.compendium-tile-copy{white-space:nowrap;text-overflow:ellipsis;padding:6px 8px 8px;overflow:hidden}.compendium-tile-name{font-size:12px;font-weight:500}.compendium-tile-score{color:var(--site-muted);margin-left:4px;font-size:11px;font-weight:300;display:inline}.compendium-empty{color:var(--site-muted);line-height:1.6}.compendium-viz-shell{grid-template-columns:1fr 1fr;gap:10px;margin:1em 0;display:grid}.compendium-viz-main{min-width:0}.compendium-viz-anatomy{grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr;gap:10px;min-width:0;display:grid}.compendium-stage,.compendium-stage-empty{aspect-ratio:1;border:1px solid var(--site-rule);background:#0b0510;position:relative;overflow:hidden}.compendium-stage-empty{color:#fffc;align-content:center;gap:6px;padding:1.5em;display:grid}.compendium-stage-poster,.compendium-stage-canvas,.compendium-stage-veil{position:absolute;inset:0}.compendium-stage-poster{transition:opacity .4s}.compendium-stage-canvas{image-rendering:pixelated;opacity:0;transition:opacity .32s}.compendium-stage.is-live .compendium-stage-poster{opacity:0}.compendium-stage.is-live .compendium-stage-canvas{opacity:1}.compendium-stage-live-badge{z-index:2;color:#fffc;text-transform:uppercase;letter-spacing:.1em;border:1px solid #fff3;padding:2px 6px;font-size:10px;position:absolute;top:10px;left:10px}.metric-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;display:grid}.metric-card{border:1px solid var(--site-rule);padding:10px}.metric-label{text-transform:uppercase;letter-spacing:.08em;color:var(--site-muted);font-size:11px;font-weight:700;display:block}.metric-value{margin-top:4px;font-size:13px;font-weight:500;display:block}.compendium-equation-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;display:grid}.compendium-equation-card{border:1px solid var(--site-rule);align-content:start;gap:8px;padding:10px;display:grid}.compendium-equation-kicker{letter-spacing:.18em;text-transform:uppercase;color:var(--site-muted);font-size:11px;font-weight:700}.compendium-equation-card h4{display:none}.compendium-equation-formula{border:1px solid var(--site-rule);background:var(--sl-overlay-ink-2);padding:10px;line-height:1.6;overflow-x:auto}.compendium-equation-formula .katex{font-size:.88em}.compendium-equation-list{gap:6px;display:grid}.compendium-equation-row{gap:2px;display:grid}.compendium-equation-label{text-transform:uppercase;letter-spacing:.08em;color:var(--site-muted);font-size:11px}.compendium-equation-value{word-break:break-word;font-size:12px;line-height:1.5}.detail-block{margin-top:1.25em}.detail-block-title{letter-spacing:.18em;text-transform:uppercase;margin:0 0 .5em;font-size:11px;font-weight:700;display:block}.detail-block pre{border:1px solid var(--site-rule);background:var(--sl-overlay-ink-2);padding:10px;font-size:12px;line-height:1.5;overflow-x:auto}.detail-links{flex-wrap:wrap;gap:.25rem 1.25rem;margin-top:1em;display:flex}.detail-links a{text-transform:uppercase;letter-spacing:.08em;font-size:11px}.detail-links a+a{border-left:1px solid #1414142e;padding-left:1.25rem}.compendium-anatomy-card{border:1px solid var(--site-rule);background:#0b0510;margin:0;position:relative;overflow:hidden
