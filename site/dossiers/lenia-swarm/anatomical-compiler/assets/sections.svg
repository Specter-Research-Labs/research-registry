<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
<style>
text { font-family: "Berkeley Mono", ui-monospace, monospace; fill: #0b0e14; }
.label { font-size: 13px; fill: rgba(11,14,20,0.68); }
.label-bold { font-size: 13px; fill: #0b0e14; font-weight: 700; }
.label-accent { font-size: 13px; fill: #ff6600; }
.label-accent2 { font-size: 13px; fill: #b4573d; }
.label-accent3 { font-size: 13px; fill: #3f8458; }
.label-accent4 { font-size: 13px; fill: #9f6f00; }
.label-accent5 { font-size: 13px; fill: #4f66bc; }
.annotation { font-size: 12px; fill: rgba(11,14,20,0.5); font-style: italic; }
</style>
<rect width="800" height="380" fill="#ffffff"/>
  <!-- Fibers -->
  <g stroke="#ff6600" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3,4">
    <line x1="120" y1="40" x2="120" y2="260"/>
    <line x1="220" y1="40" x2="220" y2="260"/>
    <line x1="320" y1="40" x2="320" y2="260"/>
    <line x1="420" y1="40" x2="420" y2="260"/>
    <line x1="520" y1="40" x2="520" y2="260"/>
    <line x1="620" y1="40" x2="620" y2="260"/>
  </g>

  <!-- All fiber points (dim) -->
  <g opacity="0.25">
    <circle cx="120" cy="100" r="3" fill="#ff6600"/>
    <circle cx="120" cy="170" r="3" fill="#ff6600"/>
    <circle cx="120" cy="230" r="3" fill="#ff6600"/>
    <circle cx="220" cy="120" r="3" fill="#ff6600"/>
    <circle cx="220" cy="200" r="3" fill="#ff6600"/>
    <circle cx="320" cy="90"  r="3" fill="#ff6600"/>
    <circle cx="320" cy="150" r="3" fill="#ff6600"/>
    <circle cx="320" cy="250" r="3" fill="#ff6600"/>
    <circle cx="420" cy="130" r="3" fill="#ff6600"/>
    <circle cx="420" cy="210" r="3" fill="#ff6600"/>
    <circle cx="520" cy="110" r="3" fill="#ff6600"/>
    <circle cx="520" cy="180" r="3" fill="#ff6600"/>
    <circle cx="520" cy="260" r="3" fill="#ff6600"/>
    <circle cx="620" cy="140" r="3" fill="#ff6600"/>
    <circle cx="620" cy="220" r="3" fill="#ff6600"/>
  </g>

  <!-- Section 1 (green) - picks one point per fiber -->
  <path d="M 120 170 C 170 170, 170 120, 220 120 C 270 120, 270 150, 320 150 C 370 150, 370 130, 420 130 C 470 130, 470 180, 520 180 C 570 180, 570 140, 620 140"
        stroke="#3f8458" stroke-width="2.5" fill="none"/>
  <circle cx="120" cy="170" r="5" fill="#3f8458"/>
  <circle cx="220" cy="120" r="5" fill="#3f8458"/>
  <circle cx="320" cy="150" r="5" fill="#3f8458"/>
  <circle cx="420" cy="130" r="5" fill="#3f8458"/>
  <circle cx="520" cy="180" r="5" fill="#3f8458"/>
  <circle cx="620" cy="140" r="5" fill="#3f8458"/>

  <!-- Section 2 (purple) - picks different points -->
  <path d="M 120 230 C 170 230, 170 200, 220 200 C 270 200, 270 250, 320 250 C 370 250, 370 210, 420 210 C 470 210, 470 260, 520 260 C 570 260, 570 220, 620 220"
        stroke="#4f66bc" stroke-width="2.5" fill="none" stroke-dasharray="6,3"/>
  <circle cx="120" cy="230" r="5" fill="#4f66bc"/>
  <circle cx="220" cy="200" r="5" fill="#4f66bc"/>
  <circle cx="320" cy="250" r="5" fill="#4f66bc"/>
  <circle cx="420" cy="210" r="5" fill="#4f66bc"/>
  <circle cx="520" cy="260" r="5" fill="#4f66bc"/>
  <circle cx="620" cy="220" r="5" fill="#4f66bc"/>

  <!-- Base -->
  <line x1="80" y1="320" x2="660" y2="320" stroke="#b4573d" stroke-width="2.5"/>
  <circle cx="120" cy="320" r="4" fill="#b4573d"/>
  <circle cx="220" cy="320" r="4" fill="#b4573d"/>
  <circle cx="320" cy="320" r="4" fill="#b4573d"/>
  <circle cx="420" cy="320" r="4" fill="#b4573d"/>
  <circle cx="520" cy="320" r="4" fill="#b4573d"/>
  <circle cx="620" cy="320" r="4" fill="#b4573d"/>

  <text x="370" y="355" class="label-accent2" text-anchor="middle">B = Phenotype Space</text>

  <!-- Labels -->
  <text x="700" y="140" class="label-accent3">section s1</text>
  <text x="700" y="156" class="label">one kernel recipe</text>
  <text x="700" y="170" class="label">per creature type</text>

  <text x="700" y="220" class="label-accent5">section s2</text>
  <text x="700" y="236" class="label">different kernels,</text>
  <text x="700" y="250" class="label">same creatures</text>

  <!-- Annotation -->
  <text x="370" y="30" class="annotation" text-anchor="middle">same phenotypes, different genotypes = substrate independence</text>
</svg>