<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" role="img" aria-labelledby="proof-title proof-desc"><style>text{font:14px monospace;fill:#172021}.goal{font:27px Georgia}.formula{font:23px Georgia}path{stroke:#365b4e;stroke-width:2;fill:none}circle{stroke:#365b4e;fill:#f4f1e8;stroke-width:2}.removed-mark{display:none}</style><title id="proof-title">Two routes through an algebraic proof</title><desc id="proof-desc">A schematic proof of distributivity. One branch rewrites by distributivity, the other swaps the factors and uses ring normalization. The toggle removes the direct rewrite from the illustrated search.</desc><text class="goal-label" x="270" y="27" text-anchor="middle">For real a, b, c, prove</text><text class="goal" x="270" y="62" text-anchor="middle">a(b + c) = ab + ac</text><g class="proof-route alternate"><path d="M260 86C260 125 128 124 128 164V190M128 231V269"/><circle cx="128" cy="180" r="5"/><text x="72" y="132" text-anchor="middle">swap factors</text><text class="formula" x="128" y="213" text-anchor="middle">(b + c)a</text><text x="109" y="250" text-anchor="end">ring</text><circle class="terminal" cx="128" cy="286" r="15"/><path class="check" d="M121 286l5 5 10-12"/><text x="128" y="323" text-anchor="middle">Proved</text></g><g class="proof-route direct"><path d="M280 86C280 125 405 124 405 164V190M405 231V269"/><circle cx="405" cy="180" r="5"/><text x="468" y="132" text-anchor="middle">distribute</text><text class="formula" x="405" y="213" text-anchor="middle">ab + ac</text><text x="386" y="250" text-anchor="end">ring</text><circle class="terminal" cx="405" cy="286" r="15"/><path class="check" d="M398 286l5 5 10-12"/><text x="405" y="323" text-anchor="middle">Proved</text></g><path class="removed-mark" d="M392 168l26 24m0-24-26 24"/></svg>