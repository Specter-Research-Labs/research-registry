<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
<style>
text { font-family: "Berkeley Mono", ui-monospace, monospace; fill: #0b0e14; letter-spacing: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; fill: #b4573d; }
.title { font-size: 20px; font-weight: 700; }
.label { font-size: 13px; fill: rgba(11,14,20,0.66); }
.small { font-size: 11px; fill: rgba(11,14,20,0.54); }
.tiny { font-size: 9px; fill: rgba(11,14,20,0.48); }
.wire { fill: none; stroke: #b4573d; stroke-width: 2.2; opacity: 0.72; }
.rule { stroke: rgba(11,14,20,0.16); stroke-width: 1; }
.dash { stroke: rgba(11,14,20,0.28); stroke-width: 1.1; stroke-dasharray: 4 5; }
.node { fill: #ffffff; stroke-width: 1.8; }
.matrix { font-size: 16px; font-weight: 700; fill: #b4573d; }
.metric { font-size: 12px; fill: rgba(11,14,20,0.66); }
.metric-hot { font-size: 12px; font-weight: 700; fill: #b4573d; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4573d"/>
  </marker>
</defs>
<rect x="0" y="0" width="760" height="360" class="" fill="#ffffff"/>
