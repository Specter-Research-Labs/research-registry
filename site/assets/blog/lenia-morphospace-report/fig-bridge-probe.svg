<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<style>
text { font-family: "Berkeley Mono", ui-monospace, monospace; fill: #0b0e14; }
.label { font-size: 13px; fill: rgba(11,14,20,0.68); }
.label-bold { font-size: 13px; fill: #0b0e14; font-weight: 700; }
.label-accent { font-size: 13px; fill: #ff6600; }
.label-accent2 { font-size: 13px; fill: #b4573d; }
.label-accent3 { font-size: 13px; fill: #3f8458; }
.label-accent4 { font-size: 13px; fill: #9f6f00; }
.label-accent5 { font-size: 13px; fill: #4f66bc; }
.annotation { font-size: 12px; fill: rgba(11,14,20,0.5); font-style: italic; }
</style>
<rect width="800" height="500" fill="#ffffff"/>
  <!-- Total space region -->
  <rect x="50" y="20" width="700" height="200" rx="8" fill="#ffffff" stroke="rgba(11,14,20,0.18)"/>
  <text x="65" y="42" class="label-bold">Total Space E (genotype parameters)</text>

  <!-- Genotype interpolation line -->
  <line x1="100" y1="120" x2="700" y2="120" stroke="#ff6600" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Bridge points -->
  <g>
    <!-- alpha=0 -->
    <circle cx="100" cy="120" r="6" fill="#3f8458"/>
    <text x="100" y="105" class="label" text-anchor="middle">alpha=0</text>

    <!-- alpha=0.1 success -->
    <circle cx="160" cy="120" r="4" fill="#3f8458"/>

    <!-- alpha=0.2 success -->
    <circle cx="220" cy="120" r="4" fill="#3f8458"/>

    <!-- alpha=0.3 success -->
    <circle cx="280" cy="120" r="4" fill="#3f8458"/>

    <!-- alpha=0.35 FAIL -->
    <g transform="translate(310, 120)">
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#b4573d" stroke-width="2"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#b4573d" stroke-width="2"/>
    </g>

    <!-- alpha=0.4 FAIL -->
    <g transform="translate(340, 120)">
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#b4573d" stroke-width="2"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#b4573d" stroke-width="2"/>
    </g>

    <!-- alpha=0.45 FAIL -->
    <g transform="translate(370, 120)">
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#b4573d" stroke-width="2"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#b4573d" stroke-width="2"/>
    </g>

    <!-- alpha=0.5 (midpoint perturbation target) -->
    <circle cx="400" cy="120" r="6" fill="#9f6f00" stroke="#ffffff" stroke-width="1.5"/>
    <text x="400" y="105" class="label-accent4" text-anchor="middle">alpha=0.5</text>

    <!-- Midpoint perturbation variants (scattered around alpha=0.5) -->
    <circle cx="395" cy="90"  r="3" fill="#9f6f00" opacity="0.5"/>
    <circle cx="410" cy="100" r="3" fill="#9f6f00" opacity="0.5"/>
    <circle cx="385" cy="140" r="3" fill="#9f6f00" opacity="0.5"/>
    <circle cx="405" cy="150" r="3" fill="#9f6f00" opacity="0.5"/>
    <circle cx="415" cy="135" r="3" fill="#9f6f00" opacity="0.5"/>
    <circle cx="390" cy="105" r="3" fill="#9f6f00" opacity="0.5"/>
    <text x="440" y="90" class="annotation">7 perturbation</text>
    <text x="440" y="102" class="annotation">variants probe</text>
    <text x="440" y="114" class="annotation">fiber thickness</text>

    <!-- alpha=0.55 FAIL -->
    <g transform="translate(430, 120)">
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#b4573d" stroke-width="2"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#b4573d" stroke-width="2"/>
    </g>

    <!-- alpha=0.6 success -->
    <circle cx="460" cy="120" r="4" fill="#3f8458"/>

    <!-- alpha=0.7 success -->
    <circle cx="520" cy="120" r="4" fill="#3f8458"/>

    <!-- alpha=0.8 success -->
    <circle cx="580" cy="120" r="4" fill="#3f8458"/>

    <!-- alpha=0.9 success -->
    <circle cx="640" cy="120" r="4" fill="#3f8458"/>

    <!-- alpha=1 -->
    <circle cx="700" cy="120" r="6" fill="#3f8458"/>
    <text x="700" y="105" class="label" text-anchor="middle">alpha=1</text>
  </g>

  <!-- Failure band shading -->
  <rect x="295" y="30" width="150" height="180" rx="4" fill="#b4573d" fill-opacity="0.05"/>

  <!-- PROJECTION ARROWS -->
  <g stroke="rgba(11,14,20,0.68)" stroke-width="1" stroke-dasharray="2,3" opacity="0.4">
    <line x1="100" y1="220" x2="100" y2="260"/>
    <line x1="220" y1="220" x2="250" y2="260"/>
    <line x1="280" y1="220" x2="310" y2="260"/>
    <line x1="460" y1="220" x2="430" y2="260"/>
    <line x1="580" y1="220" x2="530" y2="260"/>
    <line x1="700" y1="220" x2="640" y2="260"/>
  </g>
  <text x="400" y="248" class="annotation" text-anchor="middle">pi: simulate, extract fingerprint</text>

  <!-- Phenotype space (lower) -->
  <rect x="50" y="270" width="700" height="200" rx="8" fill="#ffffff" stroke="rgba(11,14,20,0.18)"/>
  <text x="65" y="292" class="label-bold">Base Space B (phenotype fingerprints)</text>

  <!-- Phenotype trajectory (not a straight line!) -->
  <path d="M 100 380 C 140 370, 180 350, 250 340 C 280 335, 300 340, 310 360"
        stroke="#3f8458" stroke-width="2.5" fill="none"/>
  <!-- gap -->
  <path d="M 310 360 L 430 400"
        stroke="#b4573d" stroke-width="2" fill="none" stroke-dasharray="5,4" opacity="0.4"/>
  <text x="370" y="365" class="label-accent2" text-anchor="middle" font-size="10">creature</text>
  <text x="370" y="378" class="label-accent2" text-anchor="middle" font-size="10">disintegrates</text>
  <!-- resume -->
  <path d="M 430 400 C 460 410, 490 400, 530 380 C 570 360, 610 355, 640 360"
        stroke="#3f8458" stroke-width="2.5" fill="none"/>

  <circle cx="100" cy="380" r="6" fill="#3f8458"/>
  <circle cx="640" cy="360" r="6" fill="#3f8458"/>
  <text x="100" y="420" class="label" text-anchor="middle">phenotype A</text>
  <text x="100" y="434" class="label" text-anchor="middle">(diamond)</text>
  <text x="640" y="400" class="label" text-anchor="middle">phenotype B</text>
  <text x="640" y="414" class="label" text-anchor="middle">(shuriken)</text>

  <!-- Annotation: linear in E is NOT linear in B -->
  <text x="400" y="450" class="annotation" text-anchor="middle">
    linear interpolation in genotype space is a CURVE in phenotype space
  </text>
  <text x="400" y="464" class="annotation" text-anchor="middle">
    this curvature IS the bundle's connection
  </text>
</svg>