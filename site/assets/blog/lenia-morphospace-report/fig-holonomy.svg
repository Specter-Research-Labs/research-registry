<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370">
<style>text { font-family: "Berkeley Mono", ui-monospace, monospace; }</style>
<rect width="700" height="370" fill="#ffffff" rx="0"/>

<text x="175" y="24" fill="#9f6f00" font-size="12" font-weight="600" text-anchor="middle">Square Loop</text>
<text x="175" y="38" fill="rgba(11,14,20,0.5)" font-size="10" text-anchor="middle">holonomy probe</text>

<!-- square -->
<circle cx="90" cy="85" r="8" fill="none" stroke="#9f6f00" stroke-width="1.5"/>
<circle cx="260" cy="85" r="8" fill="none" stroke="#9f6f00" stroke-width="1.5"/>
<circle cx="260" cy="200" r="8" fill="none" stroke="#9f6f00" stroke-width="1.5"/>
<circle cx="90" cy="200" r="8" fill="none" stroke="#9f6f00" stroke-width="1.5"/>
<text x="90" y="89" fill="#9f6f00" font-size="9" text-anchor="middle">A</text>
<text x="260" y="89" fill="#9f6f00" font-size="9" text-anchor="middle">B</text>
<text x="260" y="204" fill="#9f6f00" font-size="9" text-anchor="middle">C</text>
<text x="90" y="204" fill="#9f6f00" font-size="9" text-anchor="middle">D</text>

<defs>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#9f6f00"/>
  </marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="rgba(11,14,20,0.4)"/>
  </marker>
</defs>
<line x1="100" y1="85" x2="248" y2="85" stroke="#9f6f00" stroke-width="2" marker-end="url(#ag)"/>
<line x1="260" y1="95" x2="260" y2="188" stroke="#9f6f00" stroke-width="2" marker-end="url(#ag)"/>
<line x1="250" y1="200" x2="102" y2="200" stroke="#9f6f00" stroke-width="2" marker-end="url(#ag)"/>
<line x1="90" y1="190" x2="90" y2="97" stroke="#9f6f00" stroke-width="2" marker-end="url(#ag)"/>

<text x="175" y="77" fill="rgba(11,14,20,0.5)" font-size="9" text-anchor="middle">vary m</text>
<text x="275" y="148" fill="rgba(11,14,20,0.5)" font-size="9">vary h</text>
<text x="175" y="220" fill="rgba(11,14,20,0.5)" font-size="9" text-anchor="middle">vary m</text>
<text x="72" y="148" fill="rgba(11,14,20,0.5)" font-size="9" text-anchor="end">vary h</text>

<!-- loop result -->
<rect x="55" y="240" width="240" height="88" rx="4" fill="rgba(159,111,0,0.04)" stroke="rgba(159,111,0,0.25)" stroke-width="1"/>
<text x="175" y="258" fill="#9f6f00" font-size="10" font-weight="600" text-anchor="middle">Loop result</text>
<text x="70" y="278" fill="rgba(11,14,20,0.5)" font-size="10">phenotype closure:</text>
<text x="280" y="278" fill="#3f8458" font-size="10" text-anchor="end">0.020</text>
<text x="70" y="294" fill="rgba(11,14,20,0.5)" font-size="10">state closure:</text>
<text x="280" y="294" fill="#b4573d" font-size="10" font-weight="600" text-anchor="end">0.500</text>
<text x="70" y="310" fill="rgba(11,14,20,0.5)" font-size="10">transport/phenotype:</text>
<text x="280" y="310" fill="#9f6f00" font-size="10" font-weight="600" text-anchor="end">25.0x</text>
<text x="70" y="326" fill="rgba(11,14,20,0.5)" font-size="10">surplus over control:</text>
<text x="280" y="326" fill="#9f6f00" font-size="10" font-weight="600" text-anchor="end">+0.250</text>

<!-- RIGHT: outback control -->
<text x="530" y="24" fill="rgba(11,14,20,0.68)" font-size="12" font-weight="600" text-anchor="middle">Outback Control</text>
<text x="530" y="38" fill="rgba(11,14,20,0.5)" font-size="10" text-anchor="middle">baseline drift</text>

<circle cx="430" cy="130" r="8" fill="none" stroke="rgba(11,14,20,0.3)" stroke-width="1.5"/>
<circle cx="630" cy="130" r="8" fill="none" stroke="rgba(11,14,20,0.3)" stroke-width="1.5"/>
<text x="430" y="134" fill="rgba(11,14,20,0.5)" font-size="9" text-anchor="middle">A</text>
<text x="630" y="134" fill="rgba(11,14,20,0.5)" font-size="9" text-anchor="middle">B</text>
<line x1="440" y1="125" x2="618" y2="125" stroke="rgba(11,14,20,0.3)" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="618" y1="138" x2="440" y2="138" stroke="rgba(11,14,20,0.3)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ad)"/>
<text x="530" y="118" fill="rgba(11,14,20,0.5)" font-size="9" text-anchor="middle">out: vary h</text>
<text x="530" y="160" fill="rgba(11,14,20,0.5)" font-size="9" text-anchor="middle">back: reverse h</text>

<!-- control result -->
<rect x="410" y="190" width="240" height="68" rx="4" fill="rgba(11,14,20,0.02)" stroke="rgba(11,14,20,0.12)" stroke-width="1"/>
<text x="530" y="208" fill="rgba(11,14,20,0.68)" font-size="10" font-weight="600" text-anchor="middle">Control result (h-outback)</text>
<text x="425" y="228" fill="rgba(11,14,20,0.5)" font-size="10">phenotype closure:</text>
<text x="635" y="228" fill="#3f8458" font-size="10" text-anchor="end">0.015</text>
<text x="425" y="244" fill="rgba(11,14,20,0.5)" font-size="10">state closure:</text>
<text x="635" y="244" fill="rgba(11,14,20,0.68)" font-size="10" text-anchor="end">0.250</text>

<!-- holonomy signal -->
<rect x="410" y="280" width="240" height="52" rx="4" fill="rgba(180,87,61,0.05)" stroke="rgba(180,87,61,0.25)" stroke-width="1"/>
<text x="530" y="300" fill="#b4573d" font-size="11" font-weight="600" text-anchor="middle">Holonomy signal</text>
<text x="530" y="322" fill="#0b0e14" font-size="13" font-weight="600" text-anchor="middle">0.500 &#x2212; 0.250 = 0.250</text>
</svg>
