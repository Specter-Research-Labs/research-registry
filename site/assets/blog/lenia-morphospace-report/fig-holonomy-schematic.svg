<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
<style>
text { font-family: "Berkeley Mono", ui-monospace, monospace; fill: #0b0e14; }
.label { font-size: 13px; fill: rgba(11,14,20,0.68); }
.small { font-size: 11px; fill: rgba(11,14,20,0.55); }
.title { font-size: 13px; fill: #0b0e14; font-weight: 700; }
.accent { font-size: 13px; fill: #ff6600; }
.red { font-size: 13px; fill: #b4573d; }
.green { font-size: 13px; fill: #3f8458; }
.gold { font-size: 13px; fill: #9f6f00; }
.blue { font-size: 13px; fill: #4f66bc; }
.note { font-size: 12px; fill: rgba(11,14,20,0.5); font-style: italic; }
</style>
<rect width="800" height="460" fill="#ffffff"/>
<defs>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9f6f00"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4573d"/>
  </marker>
</defs>

<!-- Fiber over the starting phenotype neighborhood -->
<rect x="125" y="42" width="58" height="295" rx="6" fill="#ff6600" fill-opacity="0.08" stroke="#ff6600" stroke-opacity="0.2"/>
<line x1="154" y1="54" x2="154" y2="323" stroke="#ff6600" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,4"/>
<text x="154" y="28" class="accent" text-anchor="middle">fiber over</text>
<text x="154" y="44" class="accent" text-anchor="middle">a neighborhood</text>

<!-- Other phenotype fibers -->
<g stroke="#ff6600" stroke-opacity="0.08" stroke-width="1">
  <line x1="285" y1="72" x2="285" y2="310"/>
  <line x1="410" y1="72" x2="410" y2="310"/>
  <line x1="535" y1="72" x2="535" y2="310"/>
</g>

<!-- Lifted loop through genotype/state space -->
<path d="M 154 125 C 205 94, 252 82, 285 84 C 345 88, 370 116, 410 135 C 455 157, 500 165, 535 150"
      stroke="#9f6f00" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>
<path d="M 535 150 C 498 190, 452 232, 410 244 C 360 259, 314 253, 285 240 C 235 218, 194 199, 154 205"
      stroke="#9f6f00" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>

<circle cx="154" cy="125" r="8" fill="#3f8458" stroke="#ffffff" stroke-width="2"/>
<circle cx="154" cy="205" r="8" fill="#4f66bc" stroke="#ffffff" stroke-width="2"/>
<text x="154" y="112" class="green" text-anchor="middle">start</text>
<text x="154" y="228" class="blue" text-anchor="middle">return</text>

<!-- State residue bracket -->
<line x1="173" y1="125" x2="190" y2="125" stroke="#3f8458" stroke-width="1"/>
<line x1="173" y1="205" x2="190" y2="205" stroke="#4f66bc" stroke-width="1"/>
<line x1="190" y1="130" x2="190" y2="200" stroke="#b4573d" stroke-width="2" marker-end="url(#arrowRed)"/>
<text x="204" y="164" class="red">state</text>
<text x="204" y="180" class="red">residue</text>

<text x="360" y="72" class="gold" text-anchor="middle">move around phenotype space</text>
<text x="360" y="276" class="gold" text-anchor="middle">return near the starting form</text>

<!-- Base-space loop -->
<ellipse cx="345" cy="380" rx="190" ry="32" fill="none" stroke="#b4573d" stroke-width="2.5"/>
<path d="M 535 380 C 520 348, 345 346, 155 380" stroke="#9f6f00" stroke-width="2" fill="none" opacity="0.5"/>
<path d="M 155 380 C 170 412, 345 414, 535 380" stroke="#9f6f00" stroke-width="2" fill="none" opacity="0.5"/>
<circle cx="155" cy="380" r="5" fill="#b4573d"/>
<text x="155" y="404" class="label" text-anchor="middle">same neighborhood</text>
<text x="345" y="438" class="red" text-anchor="middle">closed loop in phenotype space</text>

<!-- Right-side operational readout -->
<text x="610" y="88" class="title">Test:</text>
<text x="610" y="106" class="label">lift a closed</text>
<text x="610" y="122" class="label">phenotype loop</text>

<text x="610" y="166" class="title">Measure:</text>
<text x="610" y="184" class="red">endpoint residue</text>
<text x="610" y="200" class="small">state distance at return</text>

<text x="610" y="244" class="title">Control:</text>
<text x="610" y="262" class="label">matched out-and-back</text>
<text x="610" y="278" class="small">same local scale</text>

<text x="610" y="322" class="title">Signal:</text>
<text x="610" y="340" class="red">residue enrichment</text>
<text x="610" y="356" class="small">in selected neighborhoods</text>
</svg>
