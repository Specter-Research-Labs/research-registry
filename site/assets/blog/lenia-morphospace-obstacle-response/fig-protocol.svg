    <text x="196" y="7" font-family="Berkeley Mono, ui-monospace, monospace" font-size="20" font-weight="700" fill="#111722">AHEAD</text>
  </g>
  <g transform="translate(570 342)">
    <path d="M-43 4C-47-22-24-45 6-41 36-37 53-12 44 16 34 44 0 51-26 35-36 28-41 17-43 4Z" fill="#006b68"/>
