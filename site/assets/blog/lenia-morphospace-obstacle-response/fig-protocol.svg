    <path d="m120 0-18-11v22z" fill="#006b68"/>
  </g>
  <g font-family="IBM Plex Serif, Georgia, serif" font-size="18" fill="#111722">
    <text x="62" y="366">Heading measured over</text>
    <text x="62" y="390">the previous 400 steps</text>
  </g>
  <g transform="translate(570 90)">
    <path d="M-43 4C-47-22-24-45 6-41 36-37 53-12 44 16 34 44 0 51-26 35-36 28-41 17-43 4Z" fill="#006b68"/>
