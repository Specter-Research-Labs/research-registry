<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Four continuations from one measured checkpoint</title>
  <desc id="desc">A single moving body is checkpointed, then continued without an obstacle or with a circular wall potential ahead, to its left, or to its right.</desc>
  <rect width="1120" height="560" fill="#fffef9"/>
  <g fill="none" stroke="#111722" stroke-width="3">
    <path d="M188 279H307"/>
    <path d="M307 279C369 279 368 90 442 90"/>
    <path d="M307 279C369 279 368 216 442 216"/>
    <path d="M307 279C369 279 368 342 442 342"/>
    <path d="M307 279C369 279 368 468 442 468"/>
  </g>
  <g fill="#111722">
    <path d="m298 268 19 11-19 11z"/>
    <path d="m433 79 19 11-19 11z"/>
    <path d="m433 205 19 11-19 11z"/>
    <path d="m433 331 19 11-19 11z"/>
    <path d="m433 457 19 11-19 11z"/>
  </g>
  <g font-family="Berkeley Mono, ui-monospace, monospace" fill="#111722">
    <text x="64" y="55" font-size="18" font-weight="700" letter-spacing="2">ONE CHECKPOINT</text>
    <text x="476" y="55" font-size="18" font-weight="700" letter-spacing="2">FOUR MATCHED CONTINUATIONS</text>
  </g>
  <g transform="translate(125 279)">
