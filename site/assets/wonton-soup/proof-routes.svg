<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" role="img" aria-labelledby="proof-title proof-desc"><style>text{font:15px "Berkeley Mono",monospace;fill:#20212b}.goal{font:26px "IBM Plex Serif",serif}.goal-label{font:13px "Berkeley Mono",monospace;fill:#62616a}.formula{font:23px "IBM Plex Serif",serif}.proof-route path{fill:none;stroke:currentColor;stroke-width:1.7}.proof-route circle{fill:#f8f4ea;stroke:currentColor;stroke-width:1.7}.proof-route .check{stroke-width:2}.proof-route.taken{color:#26786c}.proof-route.taken text{fill:#24665d}.proof-route.blocked{color:#879088;opacity:.22}.proof-route.blocked path{stroke-dasharray:4 5}.removed-mark{fill:none;stroke:#a44733;stroke-width:2.5}</style><title id="proof-title">Two routes through an algebraic proof</title><desc id="proof-desc">A schematic proof of distributivity. The direct route, rewriting by distributivity, is blocked; the other route swaps the factors and closes the goal with ring normalization.</desc><text class="goal-label" x="270" y="27" text-anchor="middle">For real a, b, c, prove</text><text class="goal" x="270" y="62" text-anchor="middle">a(b + c) = ab + ac</text><g class="proof-route taken"><path d="M260 86C260 125 128 124 128 164V190M128 231V269"/><circle cx="128" cy="180" r="5"/><text x="72" y="132" text-anchor="middle">swap factors</text><text class="formula" x="128" y="213" text-anchor="middle">(b + c)a</text><text x="109" y="250" text-anchor="end">ring</text><circle cx="128" cy="286" r="15"/><path class="check" d="M121 286l5 5 10-12"/><text x="128" y="323" text-anchor="middle">Proved</text></g><g class="proof-route blocked"><path d="M280 86C280 125 405 124 405 164V190M405 231V269"/><circle cx="405" cy="180" r="5"/><text x="468" y="132" text-anchor="middle">distribute</text><text class="formula" x="405" y="213" text-anchor="middle">ab + ac</text><text x="386" y="250" text-anchor="end">ring</text><circle cx="405" cy="286" r="15"/><path class="check" d="M398 286l5 5 10-12"/><text x="405" y="323" text-anchor="middle">Proved</text></g><path class="removed-mark" d="M392 168l26 24m0-24-26 24"/></svg>
