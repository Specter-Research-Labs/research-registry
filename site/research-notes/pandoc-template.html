<!doctype html>
<html lang="$lang$">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <title>$pagetitle$</title>
        <link rel="icon" href="../../assets/logo-black.svg" type="image/svg+xml" />
        <link rel="preload" href="../../fonts/BerkeleyMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="../../fonts/IBMPlexSerif-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="../../style.css" />
        <link rel="stylesheet" href="../../blog/blog.css" />
        <link rel="stylesheet" href="/assets/editorial.css?v=20260909-3" />
<link rel="stylesheet" href="/assets/publication-layout.css?v=20260909-curated">$if(publication)$<link rel="stylesheet" href="/assets/publication-formats.css">$endif$</head>
    <body class="blog-page"$if(publication)$ data-publication="note"$endif$>
        <div class="blog-shell">
            <div class="doc-paper">
                <div class="doc-top">
                    <header class="site-topnav">
                        <a class="site-brand" href="../../">
                            <img
                                src="../../assets/logo-black.svg"
                                alt="SPECTER Labs logo"
                                class="logo"
                            />
                            <span class="site-brand-name">SPECTER LABS</span>
                        </a>
                        <nav class="site-topnav-links" aria-label="Site navigation">
                    <a class="nav-link" href="../../dossiers/">Research</a>
                    <a class="nav-link" href="../../blog/">Writing</a>
                    <a class="nav-link" href="../../addenda/">Addenda</a>
                    <a class="nav-link" href="../../cabinet/">Cabinet</a>
                </nav>
                    </header>
                    <div class="site-rules" aria-hidden="true">
                        <div class="site-rule strong"></div>
                        <div class="site-rule"></div>
                    </div>
                </div>

                <main class="doc-layout">
                    <aside class="doc-aside">
                        $if(toc)$
                        <nav class="toc" aria-label="Table of contents">
                            <div class="toc-title">Contents</div>
                            $table-of-contents$
                        </nav>
                        $endif$
                    </aside>

                    <article class="doc-content">$if(publication)$<div class="publication-journal-masthead">$if(publication_pdf)$<a href="$publication_pdf$" download>Download PDF ↓</a>$endif$</div>$endif$$body$</article>
                </main>

                <footer class="doc-footer">
                    <div class="doc-footer-inner">
                        <div>Specter Labs</div>

                    </div>
                </footer>
            </div>
        </div>
        <script src="../../blog/blog.js"></script>
    </body>
</html>
