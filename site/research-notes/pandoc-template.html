<!doctype html>
<html lang="$lang$">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <title>$pagetitle$</title>
        $if(image)$<meta property="og:image" content="$image$" />$else$<meta name="spctr:card" content="Research note" />$endif$
        $if(description)$<meta name="description" content="$description$" />$endif$
        <link rel="icon" href="../../assets/logo-black.svg" type="image/svg+xml" />
        <link rel="preload" href="../../fonts/BerkeleyMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="../../fonts/IBMPlexSerif-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="../../fonts/IBMPlexSerif-Bold.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="../../style.css" />
        <link rel="stylesheet" href="../../blog/blog.css" />
        <link rel="stylesheet" href="/assets/editorial.css" />
<link rel="stylesheet" href="/assets/publication-layout.css">
<link rel="stylesheet" href="/assets/tables.css">
<link rel="stylesheet" href="/assets/site-shell.css"></head>
    <body class="blog-page">
$site-header$
        <div class="blog-shell">
            <div class="doc-paper">
                <main class="doc-layout">
                    <aside class="doc-aside">
                        <a class="doc-nav-back" href="/blog/#lab-notes">&larr; Lab notes</a>
                        $if(toc)$
                        <nav class="toc" aria-label="Table of contents">
                            <div class="toc-title">Contents</div>
                            $table-of-contents$
                        </nav>
                        $endif$
                    </aside>

                    <article class="doc-content">$if(publication_pdf)$<p class="doc-download"><a href="$publication_pdf$" download>Download PDF ↓</a></p>$endif$$body$</article>
                </main>

            </div>
        </div>
$site-footer$
        <script src="../../blog/blog.js"></script>
    </body>
</html>
