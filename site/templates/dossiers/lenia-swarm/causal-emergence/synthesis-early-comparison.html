<figure class="transplant-comparison">
  <div class="figure-introduction"><h3>Futures are already distinct. Forecasting is still catching up.</h3><p>These are two separate experiments. One branches early states under different interventions; the other compares prediction from the whole field with prediction from its best split.</p></div>
  <div class="transplant-panels">
    <div><h4>Branching at an early age</h4><svg viewBox="0 0 500 310" role="img" aria-label="Future separation at passage 8 is 104.4 percent of the passage 32 reference, normalized to 100 percent"><text x="20" y="30">Future separation · passage 32 = 100%</text><text x="20" y="83">Passage 8</text><rect x="20" y="100" width="375.84" height="25" fill="#187a6b"/><text x="409" y="120">104.4%</text><text x="20" y="163">Passage 32</text><rect x="20" y="180" width="360" height="25" fill="#8561b0"/><text x="394" y="200">100%</text><path d="M20 225H452" stroke="#a0a69b"/><text x="20" y="253">0</text><text x="380" y="253" text-anchor="middle">100%</text><text x="20" y="292">39 organisms · 5,616 futures</text></svg><p>By passage 8, interventions already lead to futures as separated as those at passage 32. This comparison describes separation, not a developmental onset.</p></div>
    <div><h4>Forecasting around the visible transition</h4><svg viewBox="0 0 500 310" role="img" aria-label="In the retrospective atlas, whole minus best split changes from minus 1.75 early to minus 0.32 at the visible transition. Both are below zero, so the split remains ahead"><text x="20" y="30">Whole − best split · retrospective atlas</text><path d="M70 85H450" stroke="#17282d" stroke-dasharray="5 5"/><text x="60" y="91" text-anchor="end">0</text><text x="70" y="69">Equal forecasting performance</text><path d="M130 233.75L365 112.2" stroke="#187a6b" stroke-width="3"/><circle cx="130" cy="233.75" r="7" fill="#187a6b"/><circle cx="365" cy="112.2" r="7" fill="#187a6b"/><text x="130" y="216" text-anchor="middle">−1.75</text><text x="365" y="143" text-anchor="middle">−0.32</text><text x="130" y="271" text-anchor="middle">Early</text><text x="365" y="271" text-anchor="middle">Visible transition</text><text x="20" y="303">Below zero: the best split predicts better.</text></svg><p>The whole field closes part of the gap, but does not overtake the split. A separate prospective test found a smaller rise of +0.364 [0.231, 0.502] before sustained form.</p></div>
  </div>
  <figcaption>The left panel normalizes a reported ratio; it does not show individual futures or uncertainty. The right panel aligns runs using their later visible transition. The prospective experiment avoids that retrospective alignment. Adding its score barely improved held-out event prediction: AUC 0.8089 → 0.8093.</figcaption>
</figure>
