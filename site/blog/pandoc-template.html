<!doctype html>
<html lang="$lang$">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <title>$pagetitle$</title>
        <link rel="icon" href="../../assets/logo-black.svg" type="image/svg+xml" />
        <link rel="preload" href="../../fonts/BerkeleyMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="../../fonts/IBMPlexSerif-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="../../style.css" />
        <link rel="stylesheet" href="../blog.css?v=field-note-sidebar-20260426" />
        <link rel="stylesheet" href="../morphospace.css" />
    </head>
    <body class="blog-page">
        <div class="blog-shell">
            <div class="doc-paper">
                <div class="doc-top">
                    <header class="site-topnav">
                        <a class="site-brand" href="../../">
                            <img
                                src="../../assets/logo-black.svg"
                                alt="SPECTER Labs logo"
                                class="logo"
                            />
                            <span class="site-brand-name">SPECTER LABS</span>
                        </a>
                        <nav class="site-topnav-links" aria-label="Site navigation">
                            <a class="nav-link" href="../../dossiers/">Dossiers</a>
                            <a class="nav-link" href="../../addenda/">Addenda</a>
                            <a class="nav-link" href="../../blog/" aria-current="page">Blog</a>
                            <a class="nav-link" href="../../cabinet/">Cabinet</a>
                        </nav>
                    </header>
                    <div class="site-rules" aria-hidden="true">
                        <div class="site-rule strong"></div>
                        <div class="site-rule"></div>
                    </div>
                </div>

                <main class="doc-layout">
                    <aside class="doc-aside">
                        <div class="doc-stamp">
                            <div class="doc-stamp-title">Field Note</div>
                            $if(slug)$
                            <div class="doc-stamp-sub">$slug$</div>
                            $endif$
                            $if(pdf)$
                            <div class="doc-stamp-field">
                                <strong>PDF</strong>
                                <a href="$pdf$">$pdf$</a>
                            </div>
                            $endif$
                            $if(status)$
                            <div class="doc-stamp-field">
                                <strong>Status</strong>
                                $status$
                            </div>
                            $endif$
                        </div>

                        $if(toc)$
                        <nav class="toc" aria-label="Table of contents">
                            <div class="toc-title">Contents</div>
                            $table-of-contents$
                        </nav>
                        $endif$
                    </aside>

                    <article class="doc-content">$body$</article>
                </main>

                <footer class="doc-footer">
                    <div class="doc-footer-inner">
                        <div>Specter Labs</div>
                        $if(slug)$
                        <div>$slug$</div>
                        $endif$
                    </div>
                </footer>
            </div>
        </div>
        <script src="../blog.js"></script>
    </body>
</html>
