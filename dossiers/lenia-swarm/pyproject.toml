[project]
name = "lenia-swarm-analysis"
version = "0.1.0"
description = "Canonical warehouse and analysis pipeline for lenia-swarm specimen artifacts"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2.1",
    "numpy>=2.1.0",
    "ripser>=0.6.10",
    "gudhi>=3.9.0",
    "scipy>=1.13.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
observer = [
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "torch>=2.2",
    "ruff>=0.11.0",
    "ty>=0.0.1a14",
]

[project.scripts]
lenia-swarm-analysis = "lenia_swarm_analysis._cli:main"
lenia-swarm-morphospace = "lenia_swarm_analysis.morphospace_cli:main"
lenia-swarm-waddington = "lenia_swarm_analysis.waddington._cli:main"
lenia-swarm-observer = "lenia_swarm_analysis.observer._cli:main"
lenia-swarm-chakazul-presets = "lenia_swarm_analysis.chakazul_presets:main"
lenia-swarm-trajectory-inverse = "lenia_swarm_analysis.anatomical_compiler.trajectory_inverse:main"
lenia-swarm-refine-trajectory-inverse = "lenia_swarm_analysis.anatomical_compiler.trajectory_inverse:refinement_main"
lenia-swarm-render-trajectory-inverse = "lenia_swarm_analysis.anatomical_compiler.render_trajectory_inverse:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lenia_swarm_analysis"]

[tool.pytest.ini_options]
testpaths = ["Tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
