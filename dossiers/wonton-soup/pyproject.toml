[project]
name = "wonton-soup"
version = "0.1.0"
description = "MCTS x Lean4 theorem proving experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "leantree",
    "networkx>=3.0",
    "numpy>=1.26",
    "psutil>=6.1",
    "scipy>=1.11",
    "duckdb>=1.1.0",
    "datasets>=4.4.2",
    # InternLM2 step-prover remote modeling code imports einops.
    "einops>=0.8.0",
    "mlx-lm>=0.22",
    "python-dotenv>=1.2.1",
    "PyYAML>=6.0",
    "rich>=13.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "typer>=0.12.0",
]

[tool.uv.sources]
leantree = { git = "https://github.com/Specter-Research-Labs/leantree.git", rev = "aab7c3840552629d4cc16fb8e4af474a9c80067b" }

[dependency-groups]
dev = [
    "ty>=0.0.1a7",
    "ruff>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# tabulate backs pandas DataFrame.to_markdown in the marimo notebooks.
analysis = ["marimo>=0.10", "plotly>=6.0", "tabulate>=0.10.0"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [
    "analysis",
    "corpus",
    "experiments",
    "prover",
    "orchestrator",
    "wonton.py",
    "setup_lean.py",
]

[tool.ty.rules]
unresolved-import = "warn"

# Test doubles stand in structurally for concrete classes with no Protocol
# (LeanAdapter, LeanGoal, TacticProvider, checkpoints) and monkeypatch bound methods.
[[tool.ty.overrides]]
include = ["**/tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Inline SVG element templates and caption prose; wrapping them obscures the markup.
"paper/build_figures.py" = ["E501"]
"docs/figures/poster/scripts/render_poster.py" = ["E501"]
# Marimo cells hold markdown prose, and `== True` is pandas elementwise comparison, not a truth test.
"analysis/notebooks/*.py" = ["E501", "E712"]

[tool.pytest.ini_options]
testpaths = ["analysis/tests", "atp/tests", "corpus/tests", "prover/tests"]
