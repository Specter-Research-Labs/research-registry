[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-competency-atlas"
version = "0.1.0"
description = "Harness and motif registry for FlyBrainLab-backed competency experiments"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0",
  "typer>=0.12",
]

[project.scripts]
fly-competency-atlas = "fly_competency_atlas.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "ty>=0.0.1a7",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [
  "fly_competency_atlas",
  "tests",
]

[tool.ty.rules]
unresolved-import = "warn"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fly_competency_atlas*"]
