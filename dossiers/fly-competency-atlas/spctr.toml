version = 1
license = "Mixed: PolyForm-Noncommercial-1.0.0 (code), CC-BY-NC-4.0 (docs)"
title = "Fly Competency Atlas"
series = "D-005"
summary = "FlyBrainLab-backed competency assays for motif inventory, backend probing, and local execution."
status = "concept"

[site]
visible = false
featured = false

[release]
stage = "wip"

[[release.surfaces]]
name = "source"
kind = "source_bundle"
publish = false
include_docs = false

[[release.surfaces]]
name = "python"
kind = "package"
publish = false
language = "python"
registry = "pypi"
publish_mode = "subdir"

[spctr]
project = "fly-competency-atlas"

[spctr.exec.check]
description = "Validate the local harness surfaces that are self-contained today"
commands = [
    ["uv", "run", "ruff", "check", "."],
    ["uv", "run", "ty", "check", "."],
    ["uv", "run", "python", "-m", "pytest", "-q"],
]
timeout_sec = 1800
network = "off"
requires = ["python", "uv"]

[spctr.runtime]
platforms = ["linux", "macos"]
requires = ["python", "uv"]
network = "off"
cache_paths = [".venv", ".ruff_cache", ".pytest_cache"]

[spctr.evidence]
card_path = "artifacts/evidence/latest.json"
